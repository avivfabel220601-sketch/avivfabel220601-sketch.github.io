<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>סיכום מהפכה — תרחיש א׳</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:72px 80px; position:relative; display:flex; flex-direction:column; gap:28px; }
.tag { font-size:21px; font-weight:500; color:#2BBFA0; margin-bottom:4px; }
.path-label { font-size:20px; font-weight:700; color:#E05050; background:rgba(224,80,80,0.1); border:1.5px solid rgba(224,80,80,0.35); border-radius:999px; padding:8px 22px; width:fit-content; }
h2 { font-size:46px; font-weight:900; color:#0D3B5E; line-height:1.15; }
.items { display:flex; flex-direction:column; gap:20px; flex:1; }
.item { background:#fff; border-radius:18px; padding:24px 28px; display:flex; align-items:flex-start; gap:20px; box-shadow:0 2px 14px rgba(13,59,94,0.07); border-right:5px solid #E05050; }
.icon { font-size:32px; width:52px; height:52px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.item-text { font-size:24px; font-weight:600; color:#0D3B5E; line-height:1.45; }
.item-text span { color:#E05050; }
.note-box { background:#0D3B5E; border-radius:16px; padding:22px 28px; display:flex; gap:16px; align-items:flex-start; }
.note-icon { font-size:28px; flex-shrink:0; }
.note-text { font-size:22px; font-weight:600; color:#fff; line-height:1.5; }
.note-text span { color:#E05050; }
.trust-line { position:absolute; bottom:72px; right:80px; font-size:19px; font-weight:500; color:#4A6A7A; opacity:0.7; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">מתפתחים פיננסית</div>
  <span class="path-label">⚠ המסלול המוכר</span>
  <h2>תרחיש א׳</h2>
  <div class="items">
    <div class="item">
      <span class="icon">😰</span>
      <p class="item-text">להמשיך לחיות <span>מהיד לפה</span> — בלי תוכנית, בלי כיוון ברור</p>
    </div>
    <div class="item">
      <span class="icon">🚫</span>
      <p class="item-text">לפחד מהבנקים ומהמערכת הפיננסית, במקום <span>להבין אותה</span></p>
    </div>
    <div class="item">
      <span class="icon">📈</span>
      <p class="item-text">להישאר בשכירות <span>שרק ממשיכה לעלות</span> שנה אחרי שנה</p>
    </div>
  </div>
  <div class="note-box">
    <span class="note-icon">⏳</span>
    <p class="note-text">בעוד 10 שנים תגלו ש<span>שום דבר לא השתנה</span> — רק המחירים</p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
</div>
</body>
</html>
