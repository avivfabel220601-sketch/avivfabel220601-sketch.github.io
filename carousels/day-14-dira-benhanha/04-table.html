<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דירה בהנחה — המספרים החדשים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:72px 80px; position:relative; display:flex; flex-direction:column; gap:32px; }
.tag { font-size:21px; font-weight:500; color:#2BBFA0; }
h2 { font-size:48px; font-weight:900; color:#0D3B5E; }
h2 span { color:#2BBFA0; }
.table-wrap { flex:1; display:flex; flex-direction:column; border-radius:20px; overflow:hidden; box-shadow:0 4px 24px rgba(13,59,94,0.10); }
.t-head { display:grid; grid-template-columns:1fr 1fr; background:#0D3B5E; }
.t-head div { padding:24px 28px; font-size:24px; font-weight:900; color:#2BBFA0; text-align:center; }
.t-row { flex:1; display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid #D8EEE9; }
.t-row:last-child { border-bottom:none; }
.t-row:nth-child(odd) { background:#fff; }
.t-row:nth-child(even) { background:#F5FAFA; }
.t-row.highlight { background:#E6FBF6; }
.t-cell { padding:10px 28px; font-size:26px; font-weight:700; color:#0D3B5E; text-align:center; display:flex; align-items:center; justify-content:center; }
.t-cell.accent { color:#2BBFA0; }
.t-cell.small-eq { font-size:18px; font-weight:500; color:#4A6A7A; flex-direction:column; gap:2px; }
.t-cell.small-eq strong { font-size:26px; font-weight:900; color:#0D3B5E; }
.note { background:#0D3B5E; border-radius:14px; padding:18px 24px; font-size:21px; font-weight:600; color:#fff; text-align:center; }
.note span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:72px; right:80px; font-size:19px; font-weight:500; color:#4A6A7A; opacity:0.7; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">תוכנית דירה בהנחה</div>
  <h2>המספרים <span>החדשים</span></h2>
  <div class="table-wrap">
    <div class="t-head">
      <div>שווי הנכס</div>
      <div>הון עצמי מינימלי</div>
    </div>
    <div class="t-row highlight">
      <div class="t-cell small-eq"><span>עד 1.675 מיליון ש"ח</span><strong>(כולל)</strong></div>
      <div class="t-cell accent">100,000 ש"ח</div>
    </div>
    <div class="t-row">
      <div class="t-cell">1.775 מיליון</div>
      <div class="t-cell">200,000 ש"ח</div>
    </div>
    <div class="t-row">
      <div class="t-cell">1.875 מיליון</div>
      <div class="t-cell">300,000 ש"ח</div>
    </div>
    <div class="t-row">
      <div class="t-cell">1.975 מיליון</div>
      <div class="t-cell">400,000 ש"ח</div>
    </div>
    <div class="t-row">
      <div class="t-cell">2.075 מיליון</div>
      <div class="t-cell">500,000 ש"ח</div>
    </div>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
</div>
</body>
</html>
