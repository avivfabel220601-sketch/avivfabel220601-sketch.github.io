<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דירה בהנחה — הוק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; background:linear-gradient(160deg, #0D3B5E 0%, #0a3348 70%, #0e4455 100%); }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
.badge { background:#2BBFA0; color:#0D3B5E; font-size:18px; font-weight:900; padding:8px 22px; border-radius:999px; letter-spacing:0.5px; }
h1 { font-size:62px; font-weight:900; color:#fff; text-align:center; line-height:1.2; max-width:860px; }
h1 span { color:#2BBFA0; }
.sub { font-size:28px; font-weight:500; color:rgba(255,255,255,0.75); text-align:center; max-width:720px; line-height:1.5; }
.alert-card { width:100%; max-width:820px; background:rgba(43,191,160,0.1); border:2px solid rgba(43,191,160,0.4); border-radius:20px; padding:36px 48px; display:flex; align-items:center; gap:28px; }
.alert-icon { font-size:56px; flex-shrink:0; }
.alert-text { font-size:26px; font-weight:700; color:#fff; line-height:1.55; }
.alert-text span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:80px; right:80px; font-size:20px; font-weight:500; color:rgba(255,255,255,0.45); }
.deco { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">תוכנית דירה בהנחה</div>
  <span class="badge">🔔 חוקי מימון חדשים</span>
  <h1>מה <span>באמת השתנה</span><br>בתוכנית דירה בהנחה?</h1>
  <div class="alert-card">
    <span class="alert-icon">🏠</span>
    <p class="alert-text">הכללים השתנו — <span>הון עצמי, מימון בנקאי ותנאי הזכאות</span> נראים אחרת ב-2026. מי שלא יודע, עלול לפספס — או להיכנס לעסקה שלא מתאימה לו.</p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#fff" opacity="0.04"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#fff" opacity="0.07"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#fff" opacity="0.10"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.20"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.30"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.15"/>
  </svg>
</div>
</body>
</html>
