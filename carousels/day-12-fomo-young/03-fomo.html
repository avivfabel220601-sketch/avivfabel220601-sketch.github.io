<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>למה הכסף שלך תקוע — FOMO</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#fff; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; justify-content:center; gap:28px; }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h2 { font-size:50px; font-weight:900; color:#0D3B5E; line-height:1.25; }
.noise-card { background:#fdf3f3; border-radius:18px; padding:30px 36px; border-right:5px solid #E05050; }
.noise-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.noise-chip { background:#fff; border:2px solid #E05050; border-radius:999px; padding:10px 20px; font-size:20px; font-weight:700; color:#E05050; }
.noise-text { font-size:24px; font-weight:600; color:#0D3B5E; line-height:1.5; }
.clarity-card { background:#0D3B5E; border-radius:18px; padding:30px 36px; border-right:5px solid #2BBFA0; }
.clarity-label { font-size:20px; font-weight:700; color:#2BBFA0; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.clarity-text { font-size:27px; font-weight:700; color:#fff; line-height:1.45; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:#4A6A7A; opacity:0.75; }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">סיבה #2</div>
  <h2>כולם מדברים על השקעות.<br>אתה לא בטוח במי להאמין.</h2>
  <div class="noise-card">
    <div class="noise-row">
      <div class="noise-chip">10% בחודש 📈</div>
      <div class="noise-chip">קריפטו 🪙</div>
      <div class="noise-chip">"שימו הכל במדדים"</div>
    </div>
    <p class="noise-text">יותר מדי קולות, סטוריז וטרנדים — ואפס בהירות איפה אתה אמור להתחיל.</p>
  </div>
  <div class="clarity-card">
    <div class="clarity-label">מה שבאמת עוזר</div>
    <p class="clarity-text">לא עוד טרנד — תוכנית מותאמת אישית, שמתאימה לגיל, להכנסה ולמטרות שלך.</p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#4DB6AC" opacity="0.22"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#4DB6AC" opacity="0.32"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#4DB6AC" opacity="0.44"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.52"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.62"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.38"/>
  </svg>
</div>
</body>
</html>
