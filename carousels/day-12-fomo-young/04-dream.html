<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>למה הכסף שלך תקוע — חלום הדירה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#0D3B5E; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h2 { font-size:46px; font-weight:900; color:#fff; text-align:center; line-height:1.3; max-width:760px; }
h2 span { color:#2BBFA0; }
.path-card { width:100%; max-width:820px; background:rgba(255,255,255,0.06); border:2px solid #2BBFA0; border-radius:24px; padding:40px 50px; display:flex; flex-direction:column; gap:22px; }
.path-bars { display:flex; align-items:flex-end; gap:16px; height:170px; }
.path-bar-col { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
.path-bar { width:100%; border-radius:8px 8px 0 0; background:#2BBFA0; }
.path-label { font-size:16px; font-weight:700; color:rgba(255,255,255,0.65); }
.flag { font-size:30px; }
.path-caption { font-size:24px; font-weight:700; color:#fff; text-align:center; line-height:1.4; }
.path-caption span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:rgba(255,255,255,0.5); }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">הפתרון</div>
  <h2>גם <span>₪3,000 בחודש</span> יכולים להוביל לדירה — עם המסלול הנכון.</h2>
  <div class="path-card">
    <div class="path-bars">
      <div class="path-bar-col">
        <div class="path-bar" style="height:50px;"></div>
        <span class="path-label">היום</span>
      </div>
      <div class="path-bar-col">
        <div class="path-bar" style="height:90px;"></div>
        <span class="path-label">שנה 1</span>
      </div>
      <div class="path-bar-col">
        <div class="path-bar" style="height:130px;"></div>
        <span class="path-label">שנה 2</span>
      </div>
      <div class="path-bar-col">
        <span class="flag">🚩</span>
        <div class="path-bar" style="height:165px;"></div>
        <span class="path-label">הון עצמי</span>
      </div>
    </div>
    <p class="path-caption">ההבדל בין <span>"זה לעולם לא יקרה"</span> לבין "אני בדרך" — תוכנית ברורה אחת.</p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#fff" opacity="0.05"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#fff" opacity="0.08"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#fff" opacity="0.11"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.22"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.32"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.16"/>
  </svg>
</div>
</body>
</html>
