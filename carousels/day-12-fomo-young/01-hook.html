<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>למה הכסף שלך תקוע — הוק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#0D3B5E; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; background:linear-gradient(160deg, #0D3B5E 0%, #123a52 70%, #134452 100%); }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h1 { font-size:64px; font-weight:900; color:#fff; text-align:center; line-height:1.2; }
h1 span { color:#2BBFA0; }
.subtitle { font-size:25px; font-weight:500; color:rgba(255,255,255,0.6); text-align:center; max-width:720px; line-height:1.5; }
.track-card { width:100%; max-width:820px; background:rgba(255,255,255,0.06); border:2px solid rgba(43,191,160,0.35); border-radius:24px; padding:50px 50px 36px; position:relative; overflow:hidden; }
.rails { position:relative; height:130px; }
.rail-line { position:absolute; bottom:24px; left:0; right:0; height:4px; background:repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0 24px, transparent 24px 40px); }
.figure { position:absolute; bottom:24px; right:30px; font-size:46px; }
.train { position:absolute; bottom:14px; left:10px; font-size:64px; opacity:0.9; }
.track-caption { font-size:22px; font-weight:700; color:rgba(255,255,255,0.7); text-align:center; margin-top:14px; }
.track-caption span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:rgba(255,255,255,0.5); }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">למה הכסף שלך תקוע</div>
  <h1>כולם מתקדמים.<br><span>אתה תקוע?</span></h1>
  <p class="subtitle">5 הסיבות שהכסף שלך לא זז — וזה לא באשמתך</p>
  <div class="track-card">
    <div class="rails">
      <div class="rail-line"></div>
      <div class="figure">🧍</div>
      <div class="train">🚄</div>
    </div>
    <p class="track-caption">כל חודש שעובר בלי תוכנית — <span>זו עוד תחנה שמפספסים</span></p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#fff" opacity="0.05"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#fff" opacity="0.08"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#fff" opacity="0.11"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.22"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.32"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.16"/>
  </svg>
</div>
</body>
</html>
