<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>איך להחזיר את האוויר הביתה — מחנק תזרימי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; justify-content:center; gap:28px; }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h2 { font-size:54px; font-weight:900; color:#0D3B5E; line-height:1.2; }
h2 span { color:#E05050; }
.cal-card { background:#0D3B5E; border-radius:22px; padding:36px 44px; display:flex; align-items:center; gap:32px; }
.cal-num { background:#E05050; color:#fff; font-size:48px; font-weight:900; border-radius:16px; width:90px; height:90px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.cal-text { font-size:24px; font-weight:700; color:#fff; line-height:1.5; }
.cal-text span { color:#2BBFA0; }
.flow-row { display:flex; gap:14px; }
.flow-chip { flex:1; background:#fff; border-radius:14px; padding:16px 18px; text-align:center; box-shadow:0 2px 16px rgba(13,59,94,0.07); }
.flow-icon { font-size:26px; margin-bottom:4px; }
.flow-label { font-size:18px; font-weight:700; color:#0D3B5E; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:#4A6A7A; opacity:0.75; }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">השלב הראשון</div>
  <h2>כל <span>10 בחודש</span> —<br>אותה תחושה.</h2>
  <div class="cal-card">
    <div class="cal-num">10</div>
    <p class="cal-text">המשכורת נכנסת, ומיד נעלמת לטובת החזרים. <span>אין אוויר לנשימה</span> — ואין שאלה למה.</p>
  </div>
  <div class="flow-row">
    <div class="flow-chip">
      <div class="flow-icon">🏠</div>
      <div class="flow-label">משכנתא</div>
    </div>
    <div class="flow-chip">
      <div class="flow-icon">💳</div>
      <div class="flow-label">אשראי</div>
    </div>
    <div class="flow-chip">
      <div class="flow-icon">🏦</div>
      <div class="flow-label">הלוואות</div>
    </div>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#4DB6AC" opacity="0.22"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#4DB6AC" opacity="0.32"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#4DB6AC" opacity="0.44"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.52"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.62"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.38"/>
  </svg>
</div>
</body>
</html>
