<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>איך להחזיר את האוויר הביתה — הוק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#0D3B5E; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; background:linear-gradient(160deg, #0D3B5E 0%, #123a52 70%, #134452 100%); }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h1 { font-size:58px; font-weight:900; color:#fff; text-align:center; line-height:1.25; max-width:780px; }
h1 span { color:#2BBFA0; }
.wheel-card { width:100%; max-width:820px; background:rgba(255,255,255,0.06); border:2px solid rgba(229,80,80,0.4); border-radius:24px; padding:44px 50px; display:flex; align-items:center; gap:36px; }
.wheel-icon { font-size:90px; }
.wheel-text { font-size:24px; font-weight:700; color:#fff; line-height:1.5; }
.wheel-text span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:rgba(255,255,255,0.5); }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">איך להחזיר את האוויר הביתה</div>
  <h1>המשכורת נכנסת<br>ונעלמת? <span>בואו נעצור את זה.</span></h1>
  <div class="wheel-card">
    <span class="wheel-icon">🌀</span>
    <p class="wheel-text">מרוץ עכברים אינסופי — עובדים קשה, ובסוף החודש <span>נשארים בלי אוויר.</span></p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#fff" opacity="0.05"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#fff" opacity="0.08"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#fff" opacity="0.11"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.22"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.32"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.16"/>
  </svg>
</div>
</body>
</html>
