<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מו״מ על דירה — חוסר גמישות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:72px 80px; position:relative; display:flex; flex-direction:column; gap:26px; }
.tag { font-size:21px; font-weight:500; color:#2BBFA0; }
h2 { font-size:42px; font-weight:900; color:#0D3B5E; line-height:1.2; }
h2 span { color:#2BBFA0; }
.items { display:flex; flex-direction:column; gap:22px; flex:1; }
.item { flex:1; background:#fff; border-radius:18px; padding:26px 30px 26px 24px; display:flex; align-items:center; gap:20px; box-shadow:0 2px 14px rgba(13,59,94,0.07); border-right:4px solid #2BBFA0; }
.num { background:#EBF7F5; border:2px solid #2BBFA0; color:#0D3B5E; font-size:30px; font-weight:900; width:50px; height:50px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.item-body { display:flex; flex-direction:column; gap:6px; }
.item-title { font-size:22px; font-weight:900; color:#0D3B5E; }
.item-desc { font-size:22px; font-weight:500; color:#2C4A5A; line-height:1.45; }
.item-desc span { color:#E05050; font-weight:700; }
.item-desc em { color:#2BBFA0; font-style:normal; font-weight:700; }
.trust-line { position:absolute; bottom:72px; right:80px; font-size:19px; font-weight:500; color:#4A6A7A; opacity:0.7; }
.deco { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">מו״מ על דירה</div>
  <h2>חוסר <span>גמישות</span></h2>
  <div class="items">
    <div class="item">
      <span class="num">1</span>
      <div class="item-body">
        <p class="item-title">התקבעות רק על המחיר</p>
        <p class="item-desc"><span>להתעקש רק על הסכום</span> — ולפספס יתרונות אחרים שעל הכף</p>
      </div>
    </div>
    <div class="item">
      <span class="num">2</span>
      <div class="item-body">
        <p class="item-title">תנאי תשלום שווים כסף</p>
        <p class="item-desc">לפעמים <em>פריסת תשלומים או מועד פינוי</em> שווים יותר מהנחה במחיר</p>
      </div>
    </div>
    <div class="item">
      <span class="num">3</span>
      <div class="item-body">
        <p class="item-title">מה עושים</p>
        <p class="item-desc">מגיעים עם <em>כמה נקודות ויתור אפשריות</em> — לא רק מחיר אחד קשיח</p>
      </div>
    </div>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco" width="220" height="140" viewBox="0 0 220 140" fill="none">
    <rect x="0"  y="100" width="32" height="40"  rx="4" fill="#4DB6AC" opacity="0.18"/>
    <rect x="40" y="76"  width="32" height="64"  rx="4" fill="#4DB6AC" opacity="0.26"/>
    <rect x="80" y="48"  width="32" height="92"  rx="4" fill="#2BBFA0" opacity="0.36"/>
    <rect x="120" y="22" width="32" height="118" rx="4" fill="#2BBFA0" opacity="0.44"/>
    <rect x="160" y="38" width="32" height="102" rx="4" fill="#2BBFA0" opacity="0.28"/>
  </svg>
</div>
</body>
</html>
