<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>המפה הפיננסית — מיתוס 2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; justify-content:center; gap:26px; }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h2 { font-size:50px; font-weight:900; color:#0D3B5E; line-height:1.2; }
.myth-card { background:#fff; border-radius:18px; padding:28px 34px; box-shadow:0 2px 16px rgba(13,59,94,0.07); border-right:5px solid #E05050; }
.myth-label { font-size:20px; font-weight:700; color:#E05050; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.myth-text { font-size:30px; font-weight:700; color:#0D3B5E; line-height:1.4; }
.reality-card { background:#0D3B5E; border-radius:18px; padding:28px 34px; border-right:5px solid #2BBFA0; }
.reality-label { font-size:20px; font-weight:700; color:#2BBFA0; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.reality-text { font-size:28px; font-weight:700; color:#fff; line-height:1.45; }
.chips-row { display:flex; gap:14px; flex-wrap:wrap; }
.chip { background:#fff; border:2px solid #2BBFA0; border-radius:999px; padding:12px 24px; font-size:22px; font-weight:700; color:#0D3B5E; }
.chip span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:#4A6A7A; opacity:0.75; }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">מיתוס #2</div>
  <h2>"תקציב = להפסיק<br>ליהנות מהחיים"</h2>
  <div class="myth-card">
    <div class="myth-label">המיתוס</div>
    <p class="myth-text">תקציב זה תור של הגבלות, וויתורים ורגשות אשמה.</p>
  </div>
  <div class="reality-card">
    <div class="reality-label">המציאות</div>
    <p class="reality-text">תקציב נכון אומר לכם בדיוק כמה אפשר להוציא בלי לדאוג — וזה מה שנותן שקט.</p>
  </div>
  <div class="chips-row">
    <div class="chip"><span>0</span> תכניות חדשות לוותר עליהן</div>
    <div class="chip"><span>100%</span> שליטה על הכסף</div>
    <div class="chip"><span>פחות</span> לחץ כלכלי כל חודש</div>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#4DB6AC" opacity="0.22"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#4DB6AC" opacity="0.32"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#4DB6AC" opacity="0.44"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.52"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.62"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.38"/>
  </svg>
</div>
</body>
</html>
