<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>המפה הפיננסית — הוק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
h1 { font-size:62px; font-weight:900; color:#0D3B5E; text-align:center; line-height:1.15; }
h1 span { color:#2BBFA0; }
.subtitle { font-size:26px; font-weight:500; color:#4A6A7A; text-align:center; line-height:1.5; max-width:760px; }
.graph-card { background:#0D3B5E; border-radius:24px; padding:44px 60px 36px; display:flex; flex-direction:column; align-items:center; gap:22px; width:100%; max-width:820px; }
.graph-bars { display:flex; align-items:flex-end; gap:18px; height:220px; }
.bar-col { display:flex; flex-direction:column; align-items:center; gap:10px; }
.bar { width:64px; border-radius:10px 10px 0 0; }
.bar-label { font-size:18px; font-weight:700; color:rgba(255,255,255,0.7); }
.graph-caption { font-size:24px; font-weight:700; color:#fff; text-align:center; }
.graph-caption span { color:#2BBFA0; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:#4A6A7A; opacity:0.75; }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">המפה הפיננסית</div>
  <h1>המפה הפיננסית <span>שלכם</span></h1>
  <p class="subtitle">מאיפה אתם מתחילים, איך יודעים איפה אתם עומדים, ולאן זה יכול להוביל ב-12 החודשים הקרובים</p>
  <div class="graph-card">
    <div class="graph-bars">
      <div class="bar-col">
        <div class="bar" style="height:60px; background:#E05050; opacity:0.75;"></div>
        <span class="bar-label">גירעון</span>
      </div>
      <div class="bar-col">
        <div class="bar" style="height:110px; background:#F5A623; opacity:0.8;"></div>
        <span class="bar-label">איזון</span>
      </div>
      <div class="bar-col">
        <div class="bar" style="height:160px; background:#4DB6AC;"></div>
        <span class="bar-label">חיסכון</span>
      </div>
      <div class="bar-col">
        <div class="bar" style="height:215px; background:#2BBFA0;"></div>
        <span class="bar-label">צמיחה</span>
      </div>
    </div>
    <p class="graph-caption">כל משפחה נמצאת היום <span>באחת מהנקודות האלה</span> — השאלה היא לאן ממשיכים</p>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#4DB6AC" opacity="0.22"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#4DB6AC" opacity="0.32"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#4DB6AC" opacity="0.44"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.52"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.62"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.38"/>
  </svg>
</div>
</body>
</html>
