<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>המפה הפיננסית — וובינר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; font-family:'Heebo',sans-serif; background:#EBF7F5; direction:rtl; }
.slide { width:1080px; height:1080px; padding:80px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; }
.tag { position:absolute; top:80px; right:80px; font-size:22px; font-weight:500; color:#2BBFA0; }
.live-badge { display:inline-flex; align-items:center; gap:10px; background:#2BBFA0; border-radius:999px; padding:10px 26px; }
.live-dot { width:12px; height:12px; border-radius:50%; background:#fff; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.live-text { font-size:22px; font-weight:900; color:#fff; letter-spacing:1px; }
h1 { font-size:54px; font-weight:900; color:#0D3B5E; text-align:center; line-height:1.2; }
h1 span { color:#2BBFA0; }
.date-display { background:#0D3B5E; border-radius:24px; padding:32px 60px; display:flex; align-items:center; gap:40px; }
.date-block { display:flex; flex-direction:column; align-items:center; gap:4px; }
.date-num { font-size:64px; font-weight:900; color:#2BBFA0; line-height:1; }
.date-label { font-size:18px; font-weight:500; color:rgba(255,255,255,0.55); text-align:center; }
.date-divider { width:2px; height:60px; background:rgba(255,255,255,0.2); }
.teaser-row { display:flex; gap:20px; }
.teaser-item { flex:1; background:#fff; border-radius:14px; padding:18px 22px; text-align:center; }
.teaser-icon { font-size:28px; margin-bottom:6px; }
.teaser-text { font-size:19px; font-weight:700; color:#0D3B5E; }
.trust-line { position:absolute; bottom:90px; right:80px; font-size:20px; font-weight:500; color:#4A6A7A; opacity:0.75; }
.deco-chart { position:absolute; bottom:0; left:0; pointer-events:none; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">וובינר חינם</div>
  <div class="live-badge">
    <div class="live-dot"></div>
    <span class="live-text">מצטרפים עכשיו</span>
  </div>
  <h1>בונים יחד את <span>המפה הפיננסית</span><br>שלכם — לייב</h1>
  <div class="date-display">
    <div class="date-block">
      <div class="date-num">23.07</div>
      <div class="date-label">יום חמישי</div>
    </div>
    <div class="date-divider"></div>
    <div class="date-block">
      <div class="date-num">20:00</div>
      <div class="date-label">בערב, באונליין</div>
    </div>
  </div>
  <div class="teaser-row">
    <div class="teaser-item">
      <div class="teaser-icon">🗺️</div>
      <div class="teaser-text">איפה אתם עומדים</div>
    </div>
    <div class="teaser-item">
      <div class="teaser-icon">🎯</div>
      <div class="teaser-text">איך בונים יעדים</div>
    </div>
    <div class="teaser-item">
      <div class="teaser-icon">🚀</div>
      <div class="teaser-text">מסלול לצמיחה</div>
    </div>
  </div>
  <p class="trust-line">✦ יועץ משכנתא עצמאי | ליווי מלא עד חתימה</p>
  <svg class="deco-chart" width="280" height="170" viewBox="0 0 280 170" fill="none">
    <rect x="0"   y="120" width="38" height="50"  rx="5" fill="#4DB6AC" opacity="0.22"/>
    <rect x="48"  y="93"  width="38" height="77"  rx="5" fill="#4DB6AC" opacity="0.32"/>
    <rect x="96"  y="60"  width="38" height="110" rx="5" fill="#4DB6AC" opacity="0.44"/>
    <rect x="144" y="32"  width="38" height="138" rx="5" fill="#2BBFA0" opacity="0.52"/>
    <rect x="192" y="8"   width="38" height="162" rx="5" fill="#2BBFA0" opacity="0.62"/>
    <rect x="240" y="28"  width="38" height="142" rx="5" fill="#2BBFA0" opacity="0.38"/>
  </svg>
</div>
</body>
</html>
